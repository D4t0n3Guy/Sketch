          ${this.fleet ? `<span class="btn ${this.pick < 0 ? "dim" : "primary"}" onclick="App.rotatePick()">\u21bb Turn</span>` : ""}
          ${this.fleet ? `<span class="btn" onclick="App.handDraw()">\u270f\ufe0e Draw by hand</span>` : ""}
          <span class="btn" onclick="App.clearPaint()">Clear</span>
        </div>
        <div class="row" style="margin-top:10px">
          <span class="btn primary big" style="max-width:280px" onclick="App.confirmPlacement()">Ready for battle!</span>
        </div>`;
      return;
    }

    /* ----- battle / over ----- */
    const me = this.me, opp = other(me);
    const myTurn = st.ph === "b" && st.t === me;
    const overMsg = st.ph === "o"
      ? (st.w === me ? `<span style="color:#5b8a5e">🏆 Victory!</span>` : `<span style="color:#c23b32">💀 Sunk…</span>`)
      : myTurn ? `<span style="color:#c23b32">Your move!</span>` : `<span style="opacity:0.6">Their move…</span>`;

    let controls = "";
    if (myTurn) {
      const pts = ptsOf(st, me);
      const canPower = !isClassic(st) && pts >= CHEAPEST;
      const bf = bfOf(st, me);
      const chip = m => {
        const P = POWERS[m];
        return `<span class="btn small ${this.mode===m?"primary":""} ${pts<P.cost?"dim":""}" onclick="App.setMode('${m}')">${P.icon} ${P.label} ${P.cost}★</span>`;
      };
      const acts = Object.keys(POWERS).filter(m => POWERS[m].kind === "act");
      const sups = Object.keys(POWERS).filter(m => POWERS[m].kind === "sup");
      const armed = [bf.spot ? "🚁 spotter up" : "", bf.smoke ? "💨 smoke laid" : "", bf.dbl ? "⚡ second round" : ""]
        .filter(Boolean).join(" · ");
      const aim = aimOf(this.mode);
      const ready = aim === "none" || this.sel != null;
      const label = (this.mode==="fire" ? "Fire! 💥"
        : this.mode==="sonar" ? "Ping! 📡"
        : this.mode==="torp" ? "Launch! 🛥"
        : this.mode==="nuke" ? "Drop it! ☢️"
        : this.mode==="depth" ? "Roll them! 🌊"
        : this.mode==="storm" ? "Summon it! 🌀"
        : this.mode==="repair" ? "Patch it! 🔧"
        : this.mode==="mine" ? "Lay it! ⚓"
        : this.mode==="radio" ? "Listen in! 📻"
        : this.mode==="spot" ? "Send it up! 🚁"
        : this.mode==="smoke" ? "Lay smoke! 💨"
        : this.mode==="dbl" ? "Load it! ⚡" : "Bombs away! ✈️")
        // the shot is already on screen; a quiet dot beats blanking the button
        + (this.saving ? `<span class="syncDot"></span>` : "");
      const hint = this.mode === "fire" ? "Tap a square on their waters to fire"
        : aim === "none"
        ? (POWERS[this.mode] && POWERS[this.mode].kind === "sup"
            ? "You'll still take your shot after this"
            : "No aiming needed — hit the button")
        : aim === "own" ? (this.mode==="repair"
            ? "Tap a damaged square of your own fleet to patch"
            : "Tap open water in your own grid to hide the mine")
        : this.mode==="torp" ? (this.sel==null ? "Tap any square to pick the lane — the torpedo runs it from the edge"
                                               : "Lane set — it stops at the first ship it meets")
        : this.sel==null ? "Tap a square on their waters to aim"
        : "Locked on — tap the button above to shoot";
      controls = `
        ${this.mode === "fire" ? "" : `<div class="row" style="margin-top:10px">
          <span class="btn primary big" style="max-width:280px;${!ready?"opacity:0.4;pointer-events:none":this.saving?"pointer-events:none":""}" onclick="App.doAction()">${label}</span>
        </div>`}
        <div class="hint">${hint}</div>
        ${!isClassic(st) && POWERS[this.mode] ? `<div class="powDesc"><b>${POWERS[this.mode].icon} ${POWERS[this.mode].label} \u2014 ${POWERS[this.mode].cost}\u2605</b><br>${POWERS[this.mode].desc}</div>` : ""}
        ${this.mode === "strike" || this.mode === "torp" ? `<div class="row" style="margin-top:8px">
          <span class="btn small ${this.dir==="row"?"primary":""}" onclick="App.setDir('row')">↔︎ Across</span>
          <span class="btn small ${this.dir==="col"?"primary":""}" onclick="App.setDir('col')">↕︎ Down</span>
        </div>` : ""}
        ${canPower ? `<div class="row" style="margin-top:12px">
          <span class="btn small ${this.mode==="fire"?"primary":""}" onclick="App.setMode('fire')">🎯 Shot</span>
          ${acts.map(chip).join("")}
        </div>
        <div class="row" style="margin-top:6px">${sups.map(chip).join("")}</div>` : ""}
        ${armed ? `<div class="hint" style="margin-top:6px">Armed: ${armed}</div>` : ""}`;
    } else if (st.ph === "b") {
      controls = `<div style="margin-top:10px"></div>` +
        this.nudgeHtml(`Waiting for ${nameOf(st, opp) || "them"} — the board updates by itself. Impatient?`);
    }

    let overCard = "";
    if (st.ph === "o") {
      const iWon = st.w === me;
      const mySunk = shipsOf(st, opp).filter(sh => shipSunk(sh, saOf(st, opp))).length;
      const theirSunk = shipsOf(st, me).filter(sh => shipSunk(sh, saOf(st, me))).length;
      overCard = `<div class="card overCard ${iWon ? "win" : "lose"}" style="text-align:center;margin-top:10px">
        <div class="overBanner">${iWon ? "🏆 VICTORY" : "💀 DEFEATED"}</div>
        <h2 style="margin:2px 0 0">${iWon
          ? `You sank ${nameOf(st, opp) || "them"}'s fleet!`
          : `${nameOf(st, opp) || "They"} sank your fleet.`}</h2>
        <div class="body" style="margin-top:6px">Ships sunk — you ${mySunk} · them ${theirSunk}</div>
        <div class="row" style="margin-top:12px">
          <span class="btn primary big" style="max-width:260px" onclick="App.rematch()">Rematch 🔄</span>
        </div>
        <div class="hint">Same link, same two of you — you'll both draw a fresh fleet.</div>
      </div>` + this.nudgeHtml(iWon
        ? `Rub it in with ${nameOf(st, opp) || "them"}:`
        : `Demand satisfaction from ${nameOf(st, opp) || "them"}:`);
    }

    const logs = st.lg.slice(-4).reverse()
      .map((l, k) => `<div class="body ${k===0?"log0":"logn"}">${l}</div>`).join("");

    el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
      <div class="status">
        <div><div class="pname">${nameOf(st, me) || "You"}</div><div class="star">★ ${ptsOf(st, me)}</div></div>
        <div style="text-align:center;flex:1"><div class="turnTxt">${overMsg}</div></div>
        <div style="text-align:right"><div class="pname">${nameOf(st, opp) || "Them"}</div><div class="star">★ ${ptsOf(st, opp)}</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${this.tab==="target"?"active":""}" onclick="App.setTab('target')">🎯 Their waters</div>
        <div class="tab ${this.tab==="fleet"?"active":""}" onclick="App.setTab('fleet')">🚢 Your fleet</div>
      </div>
      ${this.reelBtnHtml()}
      ${this.boardHtml(this.tab === "target" ? "target" : "fleet")}
      ${controls}
      ${overCard}
      <div class="card" style="margin-top:12px">
        <div class="label" style="margin-top:0">Captain's log</div>${logs}
      </div>`;
  },
};

window.App = App;
App.boot();
/* One listener on a node that never gets replaced. pointerdown fires the moment
   a finger lands, so a re-render mid-tap can't swallow it. */
const appEl = document.getElementById("app");
if (appEl) appEl.addEventListener("pointerdown", ev => {
  const el = ev.target.closest && ev.target.closest("[data-tap]");
  if (!el) return;
  const i = parseInt(el.dataset.i, 10);
  if (Number.isNaN(i)) return;
  const kind = el.dataset.tap;
  if (kind === "paint") App.tapPaint(i);
  else if (kind === "own") App.tapOwn(i);
  else if (kind === "target") App.tapTarget(i);
}, { passive: true });
window.addEventListener("hashchange", () => App.boot());
document.addEventListener("visibilitychange", () => { if (!document.hidden) App.pollNow(); });
window.addEventListener("focus", () => App.pollNow());
window.addEventListener("pageshow", () => App.pollNow());
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
  if (window.innerWidth !== lastW) { lastW = window.innerWidth; App.render(); }
});
</script>
</body>
</html>
