<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SketchShip ⚓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #fbf7ee;
    background-image: radial-gradient(rgba(0,0,0,0.028) 1px, transparent 1px);
    background-size: 22px 22px;
    color: #3b3e45;
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    font-size: 18px;
    padding: 12px 12px 48px;
  }
  #app { max-width: 520px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .logo { font-family: 'Caveat', cursive; font-size: 36px; font-weight: 700; transform: rotate(-2deg); }
  .logo b { color: #3e6fb0; font-weight: 700; }
  .iconBtn {
    width: 38px; height: 38px; border-radius: 12px; border: 2px solid #3b3e45;
    background: #fff; font-size: 20px; font-family: 'Caveat', cursive;
    cursor: pointer; box-shadow: 2px 2px 0 rgba(59,62,69,0.25);
  }
  .card {
    background: #fffdf6; border: 2px solid #3b3e45; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px;
    box-shadow: 3px 3px 0 rgba(59,62,69,0.18); transform: rotate(-0.3deg);
  }
  h2 { font-family: 'Caveat', cursive; font-size: 27px; font-weight: 700; margin-bottom: 4px; }
  .body { font-size: 17px; line-height: 1.35; }
  .label { font-size: 15px; opacity: 0.6; margin-top: 12px; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: 8px 12px; font-size: 18px; font-family: inherit;
    border: 2px solid #3b3e45; border-radius: 10px; background: #fff; outline: none;
  }
  .btn {
    display: inline-block; padding: 10px 18px; font-size: 19px;
    font-family: 'Caveat', cursive; font-weight: 700;
    border: 2px solid #3b3e45; border-radius: 12px; background: #fff; color: #3b3e45;
    cursor: pointer; box-shadow: 2px 2px 0 rgba(59,62,69,0.25);
    text-decoration: none; text-align: center;
  }
  .btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(59,62,69,0.25); }
  .btn, .cell { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .cell:active { background: rgba(255,224,102,0.75); }
  .btn.primary { background: #ffe066; }
  .btn.danger { background: #f3b6b1; }
  .btn.big { display: block; width: 100%; font-size: 23px; padding: 13px; }
  .btn.small { padding: 6px 12px; font-size: 17px; }
  .btn.dim { opacity: 0.45; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .boardWrap { display: flex; justify-content: center; margin-top: 4px; position: relative; }
  .board {
    position: relative; display: grid;
    background: #f2f8fc;
    border: 2.5px solid #3b3e45; border-radius: 10px;
    box-shadow: 4px 4px 0 rgba(59,62,69,0.18);
    overflow: hidden; touch-action: manipulation;
  }
  .cell { position: relative; cursor: pointer; }
  .cell.preview { background: rgba(255,224,102,0.55); }
  .cell.sel { outline: 3px solid #c23b32; outline-offset: -3px; border-radius: 6px; z-index: 2; }
  .cell.painted { background: rgba(74,78,86,0.75); }
  .mark { position: absolute; inset: 12%; width: 76%; height: 76%; pointer-events: none; }
  .ship {
    position: absolute; pointer-events: none;
    border: 2.5px solid #4a4e56; background: rgba(74,78,86,0.14);
    filter: url(#wobble);
  }
  .ship.sunk {
    border-color: #c23b32;
    background: repeating-linear-gradient(45deg, rgba(194,59,50,0.25) 0 4px, transparent 4px 8px);
    animation: shake 0.35s ease 3;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    background: #fffdf6; border: 2px solid #3b3e45; border-radius: 14px;
    padding: 8px 14px; margin-bottom: 10px;
    box-shadow: 3px 3px 0 rgba(59,62,69,0.18);
  }
  .pname { font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; line-height: 1; }
  .star { font-size: 16px; color: #b08900; }
  .turnTxt { font-family: 'Caveat', cursive; font-size: 25px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; }
  .tab {
    padding: 7px 14px; border: 2px solid #3b3e45; border-radius: 12px; background: #fff;
    font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700;
    cursor: pointer; opacity: 0.55;
  }
  .tab.active { background: #ffe066; opacity: 1; box-shadow: 2px 2px 0 rgba(59,62,69,0.25); }
  .warn { text-align: center; color: #c23b32; margin-top: 8px; font-size: 17px; }
  .hint { text-align: center; margin-top: 6px; opacity: 0.65; font-size: 16px; }
  .gameRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px; border-bottom: 1.5px dashed rgba(59,62,69,0.25);
  }
  .log0 { opacity: 1; } .logn { opacity: 0.55; }
  .spin { display: inline-block; animation: spinA 1.2s linear infinite; }
  @keyframes spinA { to { transform: rotate(360deg); } }
  @keyframes drawX { to { stroke-dashoffset: 0; } }
  .drawme { animation: drawX 0.45s ease forwards; }
  .d2 { animation-delay: 0.2s; }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: popIn 0.4s ease both; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-1.5px,1px); } 50% { transform: translate(1.5px,-1px); } 75% { transform: translate(-1px,-1.5px); } }
  @keyframes pingA { 0% { transform: translate(-50%,-50%) scale(0.15); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .ping {
    position: absolute; width: 100px; height: 100px; border-radius: 50%;
    border: 3px solid #7a6bb5; pointer-events: none; z-index: 4;
    animation: pingA 1.1s ease-out 2 both;
  }
  @keyframes flyA { from { transform: translate(0,0) var(--rot,rotate(0deg)); } to { transform: var(--fly) var(--rot,rotate(0deg)); } }
  .plane { position: absolute; z-index: 5; font-size: 26px; pointer-events: none; animation: flyA 1.4s linear both; }
  .mineMark { font-size: 15px; opacity: 0.55; line-height: 1; }
  @keyframes syncPulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  .syncDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #3e6fb0; margin-left: 6px; vertical-align: middle;
    animation: syncPulse 1s ease-in-out infinite; }
  @keyframes nukeA { 0% { transform: translate(-50%,-50%) scale(0.15); opacity: 0; }
    25% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; } }
  .nuke { position: absolute; z-index: 6; font-size: 38px; pointer-events: none;
    animation: nukeA 1.9s ease-out both; animation-delay: 0.45s; }
  @keyframes wakeA { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .wake { position: absolute; z-index: 4; height: 3px; background: rgba(62,111,176,0.45);
    transform-origin: left center; pointer-events: none; border-radius: 2px;
    animation: wakeA 1.5s linear both; }
  @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
  .floater {
    position: absolute; z-index: 6; pointer-events: none;
    font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #b08900;
    animation: floatUp 1.8s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
  </filter>
</svg>
<div id="app"></div>

<script>
/* ================================================================
   SketchShip — hosted edition.
   Games live on the server (Netlify function + Blobs).
   Links are short and identical for both players: #g=GAMEID
   Who you are comes from a per-device id in localStorage, never the link.
   ================================================================ */
"use strict";

/* aim: where you tap — "enemy", "own", or "none" (fires straight away).
   kind: "act" spends your turn, "sup" is a buy-and-keep-shooting support move. */
const POWERS = {
  radio:  { cost: 2, icon: "\uD83D\uDCFB", label: "Intercept", aim: "none",  kind: "sup" },
  mine:   { cost: 3, icon: "\u2693",       label: "Mine",      aim: "own",   kind: "act" },
  sonar:  { cost: 3, icon: "\uD83D\uDCE1", label: "Sonar",     aim: "enemy", kind: "act" },
  spot:   { cost: 3, icon: "\uD83D\uDE81", label: "Spotter",   aim: "none",  kind: "sup" },
  repair: { cost: 4, icon: "\uD83D\uDD27", label: "Repair",    aim: "own",   kind: "act" },
  depth:  { cost: 5, icon: "\uD83C\uDF0A", label: "Charges",   aim: "enemy", kind: "act" },
  smoke:  { cost: 5, icon: "\uD83D\uDCA8", label: "Smoke",     aim: "none",  kind: "sup" },
  strike: { cost: 5, icon: "\u2708\uFE0F", label: "Strike",    aim: "enemy", kind: "act" },
  torp:   { cost: 5, icon: "\uD83D\uDEE5", label: "Torpedo",   aim: "enemy", kind: "act" },
  dbl:    { cost: 6, icon: "\u26A1",       label: "Double",    aim: "none",  kind: "sup" },
  storm:  { cost: 7, icon: "\uD83C\uDF00", label: "Storm",     aim: "none",  kind: "act" },
  nuke:   { cost: 8, icon: "\u2622\uFE0F", label: "Nuke",      aim: "enemy", kind: "act" },
};
const CHEAPEST = Math.min(...Object.values(POWERS).map(p => p.cost));
const aimOf = m => m === "fire" ? "enemy" : (POWERS[m] ? POWERS[m].aim : "enemy");

/* ---------- api ---------- */
async function api(payload) {
  const res = await fetch("/api/game", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ ...payload, pid: myPid() }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "request failed"), { status: res.status, data });
  return data;
}

/* ---------- local storage ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function myGames() { try { return JSON.parse(lsGet("sks:games") || "{}"); } catch (e) { return {}; } }

/* This device's permanent player identity. Created once, never shared in a link. */
function myPid() {
  let p = lsGet("sks:pid");
  if (!p) {
    const buf = new Uint8Array(16);
    crypto.getRandomValues(buf);
    p = Array.from(buf, b => b.toString(16).padStart(2, "0")).join("");
    lsSet("sks:pid", p);
  }
  return p;
}
function saveMyGame(id, entry) {
  const g = myGames(); g[id] = { ...(g[id] || {}), ...entry, ts: Date.now() };
  lsSet("sks:games", JSON.stringify(g));
}
function forgetMyGame(id) {
  const g = myGames(); delete g[id]; lsSet("sks:games", JSON.stringify(g));
}

/* ---------- grid helpers ---------- */
const rcOf = (i, s) => [Math.floor(i / s), i % s];
const idxOf = (r, c, s) => r * s + c;
const chAt = (str, i) => str.charAt(i) || ".";
function chSet(str, i, ch) { return str.substring(0, i) + ch + str.substring(i + 1); }

function analyzeShips(cellSet, s) {
  const seen = new Set(), ships = [];
  for (const start of cellSet) {
    if (seen.has(start)) continue;
    const comp = [], stack = [start];
    seen.add(start);
    while (stack.length) {
      const cur = stack.pop(); comp.push(cur);
      const [r, c] = rcOf(cur, s);
      for (const [nr, nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]) {
        if (nr < 0 || nc < 0 || nr >= s || nc >= s) continue;
        const ni = idxOf(nr, nc, s);
        if (cellSet.has(ni) && !seen.has(ni)) { seen.add(ni); stack.push(ni); }
      }
    }
    const rows = new Set(comp.map(i => rcOf(i, s)[0]));
    const cols = new Set(comp.map(i => rcOf(i, s)[1]));
    if (rows.size > 1 && cols.size > 1)
      return { ok: false, error: "Ships must be straight lines — no L-shapes or blobs." };
    const line = rows.size === 1 ? comp.map(i => rcOf(i,s)[1]) : comp.map(i => rcOf(i,s)[0]);
    line.sort((a, b) => a - b);
    for (let k = 1; k < line.length; k++)
      if (line[k] !== line[k-1] + 1)
        return { ok: false, error: "Ship pieces must connect with no gaps." };
    comp.sort((a, b) => a - b);
    ships.push(comp);
  }
  return { ok: true, ships };
}

/* ---------- state accessors ---------- */
const other = p => p === "p1" ? "p2" : "p1";
const nameOf = (st, p) => p === "p1" ? st.n1 : st.n2;
const shipsOf = (st, p) => p === "p1" ? st.sh1 : st.sh2;
const saOf = (st, p) => p === "p1" ? st.sa1 : st.sa2;
const intelOf = (st, p) => p === "p1" ? st.i1 : st.i2;
const ptsOf = (st, p) => p === "p1" ? st.pt1 : st.pt2;
function setSA(st, p, v) { if (p === "p1") st.sa1 = v; else st.sa2 = v; }
function setIntel(st, p, v) { if (p === "p1") st.i1 = v; else st.i2 = v; }
function setPts(st, p, v) { if (p === "p1") st.pt1 = v; else st.pt2 = v; }
const bfOf = (st, p) => (p === "p1" ? st.bf1 : st.bf2) || {};
function setBf(st, p, v) { if (p === "p1") st.bf1 = v; else st.bf2 = v; }
const mnOf = (st, p) => (p === "p1" ? st.mn1 : st.mn2) || [];
function setMn(st, p, v) { if (p === "p1") st.mn1 = v; else st.mn2 = v; }
/* Nothing to replay for a turn spent on your own side of the board. */
function blankReel(st, me) { st.rl = { by: me, acts: [], open: false }; }
function setShips(st, p, v) { if (p === "p1") st.sh1 = v; else st.sh2 = v; }
function setName(st, p, v) { if (p === "p1") st.n1 = v; else st.n2 = v; }

/* A turn can now be several shots long, since a hit buys another go. Collect
   them so the other player can watch the whole run, in order, when they return.
   `open` means the streak is still going — don't replay it yet. */
function pushReel(st, me, act, keepTurn) {
  const streak = st.rl && st.rl.by === me && st.rl.open;
  const acts = streak ? [...st.rl.acts, act] : [act];
  st.rl = { by: me, acts: acts.slice(-12), open: !!keepTurn };
}

function shipSunk(ship, sa) { return ship.every(i => chAt(sa, i) === "h"); }
function allSunk(ships, sa) {
  const flat = ships.flat();
  return flat.length > 0 && flat.every(i => chAt(sa, i) === "h");
}
function findShipAt(ships, i) { return ships.find(sh => sh.includes(i)); }

function freshState(s, b, n1, n2) {
  const blank = ".".repeat(s * s);
  return {
    v: 3, mv: 1, s, b,
    n1: n1 || "", n2: n2 || "",
    ph: "p", t: "p1", w: "",
    sh1: [], sh2: [],
    sa1: blank, sa2: blank,
    i1: blank, i2: blank,
    pt1: 0, pt2: 0,
    bf1: {}, bf2: {},      // armed support buffs
    mn1: [], mn2: [],      // mines laid in your own waters
    la: null, lg: [],
  };
}

/* ================================================================
   App
   ================================================================ */
const App = {
  st: null,
  id: null,
  me: null,
  epoch: 0,        // bumped on every local save; invalidates in-flight polls
  resync: false,   // set when a save failed and server truth must be refetched
  reelTimer: null,
  replaying: false,
  reelPos: 0, reelLen: 0,
  view: "home",
  tab: "target",
  mode: "fire",
  dir: "row",
  sel: null,
  paint: new Set(),
  placeMsg: "",
  anim: null,
  copied: false,
  netErr: "",
  saving: false,
  help: false,
  pollTimer: null,

  /* ---------- boot ---------- */
  boot() {
    const params = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    const g = params.get("g");
    if (g) { this.open(g); return; }
    this.view = "home";
    this.render();
  },

  async open(id) {
    this.view = "loading"; this.render();
    try {
      const res = await api({ action: "get", id });
      this.applyServer(id, res, true);
    } catch (e) {
      this.view = "home";
      this.netErr = e.status === 404
        ? "That game wasn't found — it may have been erased."
        : e.status === 403
        ? "Both seats in that game are already taken."
        : e.status === 410
        ? "That game predates player accounts — start a fresh one."
        : "Couldn't reach the ocean 🌊 Check your connection and tap the game again.";
      this.render();
    }
  },

  applyServer(id, res, firstLoad) {
    const prevMv = this.st ? this.st.mv : parseInt(lsGet("sks:seen:" + id) || "0", 10);
    this.id = id;
    this.me = res.you;
    this.st = res.st;
    this.netErr = "";
    saveMyGame(id, {
      label: `${res.st.n1 || "?"} vs ${res.st.n2 || "…"}`,
    });
    lsSet("sks:seen:" + id, String(res.st.mv));
    // Their turn is over and it's ours again — roll the tape.
    const rl = res.st.rl;
    const replay = !!(rl && rl.by !== this.me && !rl.open
      && rl.acts && rl.acts.length && res.st.mv > prevMv && prevMv > 0);
    if (replay) this.tab = "fleet";
    this.view = this.viewFor(res.st);
    if (firstLoad && this.view === "place" && shipsOf(res.st, this.me).length === 0) {
      this.paint = new Set(); this.placeMsg = "";
    }
    this.render();
    if (replay) this.playReel(rl);
    this.pollStart();
  },

  viewFor(st) { return st.ph === "p" ? "place" : "battle"; },

  /* ---------- turn replay ---------- */
  actMs(a) {
    const n = (a.c || []).length;
    const blast = (a.c || []).some(x => x[2] === "b");
    if (blast) return 900 + n * 55 + 1400;
    if (a.ty === "strike") return 3400;
    if (a.ty === "sonar") return 2800;
    if (a.ty === "torp") return 300 + n * 100 + 1200;
    if (a.ty === "nuke") return 800 + n * 60 + 1500;
    if (a.ty === "storm") return 400 + n * 130 + 1200;
    if (a.ty === "depth") return 400 + n * 320 + 1200;
    if (a.ty === "repair" || a.ty === "mine") return 900;
    return 1600;
  },
  stopReel() {
    if (this.reelTimer) clearTimeout(this.reelTimer);
    this.reelTimer = null;
    this.replaying = false;
    this.anim = null;
    this.render();
  },
  replayReel() {
    const rl = this.st && this.st.rl;
    if (rl && rl.by !== this.me && !rl.open) this.playReel(rl);
  },
  playReel(rl) {
    if (!rl || !rl.acts || !rl.acts.length) return;
    if (this.reelTimer) clearTimeout(this.reelTimer);
    const acts = rl.acts;
    this.replaying = true;
    this.reelLen = acts.length;
    this.tab = "fleet";
    let k = 0;
    const step = () => {
      if (k >= acts.length) {
        this.reelTimer = null; this.replaying = false; this.anim = null; this.render();
        return;
      }
      const a = acts[k];
      // Hide the squares that later shots in this same turn will reveal, so the
      // replay unfolds as it happened instead of showing the finished board.
      const mask = new Set();
      for (let j = k + 1; j < acts.length; j++)
        for (const cell of (acts[j].c || [])) mask.add(cell[0]);
      this.anim = { ...a, incoming: true, mask };
      this.reelPos = k + 1;
      this.render();
      k++;
      this.reelTimer = setTimeout(step, this.actMs(a) + 450);
    };
    step();
  },

  reelBtnHtml() {
    const rl = this.st && this.st.rl;
    if (!rl || rl.by === this.me || rl.open || !rl.acts || !rl.acts.length) return "";
    if (this.replaying)
      return `<div class="row" style="margin-top:8px">
        <span class="btn small" onclick="App.stopReel()">⏭ Skip — shot ${this.reelPos} of ${this.reelLen}</span></div>`;
    const n = rl.acts.length;
    return `<div class="row" style="margin-top:8px">
      <span class="btn small" onclick="App.replayReel()">▶︎ Replay their turn (${n} shot${n > 1 ? "s" : ""})</span></div>`;
  },

  /* ---------- polling ---------- */
  /* How eagerly to check depends on whether anything could actually change:
     fast while it's their move and the app is on screen, idle otherwise. */
  pollDelay() {
    if (document.hidden) return 20000;
    const st = this.st;
    if (!st || st.ph === "o") return 10000;
    if (st.ph === "p") return 2500;
    return st.t === this.me ? 6000 : 1500;
  },
  pollStop() {
    if (this.pollTimer) clearTimeout(this.pollTimer);
    this.pollTimer = null;
  },
  pollStart() {
    this.pollStop();
    const tick = async () => {
      await this.pollTick();
      if (this.id) this.pollTimer = setTimeout(tick, this.pollDelay());
    };
    this.pollTimer = setTimeout(tick, this.pollDelay());
  },
  /* Coming back to the app shouldn't mean waiting out a timer. */
  pollNow() {
    if (!this.id) return;
    this.pollTick();
    this.pollStart();
  },
  async pollTick() {
    const st = this.st;
    if (!st || !this.id || this.saving) return;
    const waiting =
      (st.ph === "p" && shipsOf(st, this.me).length > 0 && shipsOf(st, other(this.me)).length === 0) ||
      (st.ph === "b" && st.t !== this.me);
    // A failed save leaves us unsure what the server holds, so refresh regardless.
    if (!waiting && !this.resync) return;
    const id = this.id, epoch = this.epoch;
    try {
      const res = await api({ action: "get", id });
      // This request may have been in flight while we saved a move of our own.
      // Anything that raced with a local save is stale by definition — drop it,
      // or it wipes the shot the player just watched land.
      if (this.id !== id || this.saving || this.epoch !== epoch || !this.st) return;
      if (this.resync || res.st.mv > this.st.mv) {
        this.resync = false;
        this.netErr = "";
        this.applyServer(id, res, false);
      }
    } catch (e) { /* silent — next tick */ }
  },

  /* ---------- save ---------- */
  async commit() {
    const prevMv = this.st.mv;
    this.st.mv = prevMv + 1;
    this.epoch++;
    this.saving = true;
    try {
      await api({ action: "save", id: this.id, prevMv, st: this.st });
      lsSet("sks:seen:" + this.id, String(this.st.mv));
    } catch (e) {
      if (e.status === 409 && e.data && e.data.st) {
        // out of sync — take server truth
        this.st = e.data.st;
        this.resync = false;
        this.netErr = "Whoops — the game had moved on. Board refreshed, try again.";
        this.view = this.viewFor(this.st);
        lsSet("sks:seen:" + this.id, String(this.st.mv));
      } else {
        // The board was already mutated in place, so rolling back mv alone would
        // leave a phantom shot on screen. Ask the server for the truth instead.
        this.netErr = "Couldn't save that move 🌊 Reconnecting…";
        this.resync = true;
      }
    }
    this.saving = false;
    this.render();
  },

  /* ---------- flows ---------- */
  startSetup() { this.netErr = ""; this.view = "setup"; this.render(); },

  async createGame() {
    const name = document.getElementById("nm").value.trim();
    if (!name) { alert("Give us a name, Admiral!"); return; }
    lsSet("sks:name", name);
    const s = parseInt(document.querySelector(".sizeBtn.primary").dataset.s, 10);
    const b = parseInt(document.getElementById("budget").textContent, 10);
    const st = freshState(s, b, name);
    this.view = "loading"; this.render();
    try {
      const res = await api({ action: "create", st });
      this.id = res.id;
      this.me = "p1"; this.st = st;
      history.replaceState(null, "", "#g=" + res.id);
      saveMyGame(res.id, { label: `${name} vs …` });
      lsSet("sks:seen:" + res.id, "1");
      this.paint = new Set(); this.placeMsg = "";
      this.view = "place";
      this.render();
      this.pollStart();
    } catch (e) {
      this.view = "setup"; this.netErr = "Couldn't create the game 🌊 Check connection.";
      this.render();
    }
  },

  pickSize(el) {
    document.querySelectorAll(".sizeBtn").forEach(x => x.classList.remove("primary"));
    el.classList.add("primary");
  },
  bumpBudget(d) {
    const el = document.getElementById("budget");
    let v = parseInt(el.textContent, 10) + d;
    v = Math.max(6, Math.min(30, v));
    el.textContent = v;
  },

  tapPaint(i) {
    if (this.paint.has(i)) this.paint.delete(i);
    else {
      if (this.paint.size >= this.st.b) {
        this.placeMsg = `That's all ${this.st.b} ship points — remove one first.`;
        this.render(); return;
      }
      this.paint.add(i);
    }
    this.placeMsg = "";
    this.render();
  },
  clearPaint() { this.paint = new Set(); this.placeMsg = ""; this.render(); },

  async confirmPlacement() {
    const st = this.st;
    if (!nameOf(st, this.me)) {
      const nm = document.getElementById("nm").value.trim();
      if (!nm) { this.placeMsg = "Enter your name first!"; this.render(); return; }
      setName(st, this.me, nm);
      lsSet("sks:name", nm);
    }
    if (this.paint.size !== st.b) {
      this.placeMsg = `Use exactly ${st.b} points — you've placed ${this.paint.size}.`;
      this.render(); return;
    }
    const res = analyzeShips(this.paint, st.s);
    if (!res.ok) { this.placeMsg = res.error; this.render(); return; }
    setShips(st, this.me, res.ships);
    const oppShips = shipsOf(st, other(this.me));
    if (oppShips.length > 0) {
      st.ph = "b";
      st.t = this.me; // joiner fires first
      st.lg = [...st.lg.slice(-4), "⚓ Battle begins!"];
      this.view = "battle"; this.tab = "target";
    } else {
      st.t = other(this.me);
      this.view = "place";
    }
    saveMyGame(this.id, { label: `${st.n1 || "?"} vs ${st.n2 || "…"}` });
    await this.commit();
  },

  /* ---------- battle ---------- */
  setTab(t) { this.tab = t; this.render(); },
  setMode(m) {
    const st = this.st;
    if (m === "sonar" && ptsOf(st, this.me) < POWERS.sonar.cost) return;
    if (POWERS[m] && ptsOf(st, this.me) < POWERS[m].cost) return;
    this.mode = m; this.sel = null; this.netErr = "";
    const a = aimOf(m);
    if (a === "own") this.tab = "fleet";
    else if (a === "enemy") this.tab = "target";
    this.render();
  },
  setDir(d) { this.dir = d; this.render(); },

  tapTarget(i) {
    const st = this.st;
    if (st.ph !== "b" || st.t !== this.me || this.saving) return;
    if (aimOf(this.mode) !== "enemy") return;
    if (this.mode === "fire" && chAt(saOf(st, other(this.me)), i) !== ".") return;
    this.sel = (this.sel === i) ? null : i;
    this.render();
  },

  tapOwn(i) {
    const st = this.st;
    if (!st || st.ph !== "b" || st.t !== this.me || this.saving) return;
    if (aimOf(this.mode) !== "own") return;
    this.sel = (this.sel === i) ? null : i;
    this.netErr = "";
    this.render();
  },

  async useSupport(m) {
    const st = this.st, me = this.me, opp = other(me);
    if (!st || st.ph !== "b" || st.t !== me || this.saving) return;
    if (ptsOf(st, me) < POWERS[m].cost) return;
    const bf = { ...bfOf(st, me) };
    let line = "";

    if (m === "radio") {
      const afloat = shipsOf(st, opp).filter(sh => !shipSunk(sh, saOf(st, opp)));
      let big = afloat.length ? Math.max(...afloat.map(sh => sh.length)) : 0;
      const oppBf = { ...bfOf(st, opp) };
      let lied = false;
      if (oppBf.smoke) {                       // smoke feeds the intercept a false number
        delete oppBf.smoke; setBf(st, opp, oppBf); lied = true;
        big = Math.max(1, big + (Math.random() < 0.5 ? -1 : 1));
      }
      line = afloat.length
        ? `\uD83D\uDCFB ${nameOf(st, me)} intercepted chatter \u2014 largest ship still afloat is ${big} long`
        : `\uD83D\uDCFB ${nameOf(st, me)} intercepted chatter \u2014 nothing left afloat`;
      if (lied) line += " (or so the transmission said)";
    } else if (m === "spot") {
      bf.spot = 1;
      line = `\uD83D\uDE81 ${nameOf(st, me)} put a spotter in the air`;
    } else if (m === "smoke") {
      bf.smoke = 1;
      line = `\uD83D\uDCA8 ${nameOf(st, me)} laid a smoke screen`;
    } else if (m === "dbl") {
      bf.dbl = 1;
      line = `\u26A1 ${nameOf(st, me)} loaded a second round`;
    }

    setBf(st, me, bf);
    setPts(st, me, ptsOf(st, me) - POWERS[m].cost);
    st.lg = [...st.lg.slice(-4), line];
    this.netErr = "";
    this.render();
    this.commit();             // turn stays with you — take your shot
  },

  async doAction() {
    const st = this.st, me = this.me, opp = other(me);
    if (st.ph !== "b" || st.t !== me || this.sel == null || this.saving) return;
    const s = st.s, mode = this.mode, aim = this.sel;
    let cells = [];

    if (mode === "fire") {
      cells = [this.sel];
    } else if (mode === "sonar") {
      if (ptsOf(st, me) < POWERS.sonar.cost) return;
      const [r, c] = rcOf(this.sel, s);
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < s && nc < s) cells.push(idxOf(nr, nc, s));
      }
      const shipCells = new Set(shipsOf(st, opp).flat());
      // A smoke screen laid by the defender feeds this sweep garbage.
      const oppBf = { ...bfOf(st, opp) };
      const smoked = !!oppBf.smoke;
      if (smoked) { delete oppBf.smoke; setBf(st, opp, oppBf); }
      let intel = intelOf(st, me);
      const results = cells.map(i => {
        const has = smoked ? !shipCells.has(i) : shipCells.has(i);
        intel = chSet(intel, i, has ? "y" : "n");
        return [i, has ? "p" : "c"];
      });
      setIntel(st, me, intel);
      setPts(st, me, ptsOf(st, me) - POWERS.sonar.cost);
      st.t = opp;
      st.la = { by: me, ty: "sonar", c: results, k: [], center: aim };
      pushReel(st, me, st.la, false);
      st.lg = [...st.lg.slice(-4), `\uD83D\uDCE1 ${nameOf(st, me)} scanned the waters` +
        (smoked ? ` \u2014 but \uD83D\uDCA8 ${nameOf(st, opp)}'s smoke fouled the read` : "")];
      this.anim = { ty: "sonar", c: results, center: this.sel };
      this.sel = null; this.mode = "fire";
      await this.commit();
      setTimeout(() => { this.anim = null; this.render(); }, 2800);
      return;
    } else if (mode === "repair") {
      if (ptsOf(st, me) < POWERS.repair.cost) return;
      const mySa = saOf(st, me);
      if (chAt(mySa, aim) !== "h") { this.netErr = "Pick a damaged square of your own fleet."; this.render(); return; }
      const ship = findShipAt(shipsOf(st, me), aim);
      if (!ship || shipSunk(ship, mySa)) { this.netErr = "That ship is gone \u2014 no patching a wreck."; this.render(); return; }
      setSA(st, me, chSet(mySa, aim, "."));
      setPts(st, me, ptsOf(st, me) - POWERS.repair.cost);
      st.t = opp;
      st.la = { by: me, ty: "repair", c: [], k: [] };
      blankReel(st, me);
      st.lg = [...st.lg.slice(-4), `\uD83D\uDD27 ${nameOf(st, me)}'s crew patched a hull breach`];
      this.sel = null; this.mode = "fire"; this.netErr = "";
      this.render(); this.commit();
      return;
    } else if (mode === "mine") {
      if (ptsOf(st, me) < POWERS.mine.cost) return;
      const mines = mnOf(st, me);
      if (chAt(saOf(st, me), aim) !== "." || mines.includes(aim) || shipsOf(st, me).flat().includes(aim)) {
        this.netErr = "Mines go in open water you still hold."; this.render(); return;
      }
      setMn(st, me, [...mines, aim]);
      setPts(st, me, ptsOf(st, me) - POWERS.mine.cost);
      st.t = opp;
      st.la = { by: me, ty: "mine", c: [], k: [] };
      blankReel(st, me);
      st.lg = [...st.lg.slice(-4), `\u2693 ${nameOf(st, me)} slipped a mine into the shallows`];
      this.sel = null; this.mode = "fire"; this.netErr = "";
      this.render(); this.commit();
      return;
    } else if (mode === "depth") {
      if (ptsOf(st, me) < POWERS.depth.cost) return;
      // Three charges scattered blind inside a 5x5 box — no aiming the individual hits.
      const [r, c] = rcOf(aim, s);
      const box = [];
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nc < 0 || nr >= s || nc >= s) continue;
        const ni = idxOf(nr, nc, s);
        if (chAt(saOf(st, opp), ni) === ".") box.push(ni);
      }
      for (let k = box.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [box[k], box[j]] = [box[j], box[k]];
      }
      cells = box.slice(0, 3);
      setPts(st, me, ptsOf(st, me) - POWERS.depth.cost);
    } else if (mode === "storm") {
      if (ptsOf(st, me) < POWERS.storm.cost) return;
      // One random unknown square in every row.
      const oppSa = saOf(st, opp);
      for (let r = 0; r < s; r++) {
        const open = [];
        for (let c = 0; c < s; c++) {
          const ni = idxOf(r, c, s);
          if (chAt(oppSa, ni) === ".") open.push(ni);
        }
        if (open.length) cells.push(open[Math.floor(Math.random() * open.length)]);
      }
      setPts(st, me, ptsOf(st, me) - POWERS.storm.cost);
    } else if (mode === "torp") {
      if (ptsOf(st, me) < POWERS.torp.cost) return;
      // The sub launches from the edge and runs the lane until something stops it.
      const [r, c] = rcOf(aim, s);
      const hull = new Set(shipsOf(st, opp).flat());
      const sa0 = saOf(st, opp);
      for (let k = 0; k < s; k++) {
        const ni = this.dir === "col" ? idxOf(k, c, s) : idxOf(r, k, s);
        cells.push(ni);
        if (hull.has(ni) && chAt(sa0, ni) === ".") break;   // torpedo detonates here
      }
      setPts(st, me, ptsOf(st, me) - POWERS.torp.cost);
    } else if (mode === "nuke") {
      if (ptsOf(st, me) < POWERS.nuke.cost) return;
      const [r, c] = rcOf(aim, s);
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < s && nc < s) cells.push(idxOf(nr, nc, s));
      }
      setPts(st, me, ptsOf(st, me) - POWERS.nuke.cost);
    } else if (mode === "strike") {
      if (ptsOf(st, me) < POWERS.strike.cost) return;
      const [r, c] = rcOf(this.sel, s);
      for (let d = -2; d <= 2; d++) {
        const nr = this.dir === "col" ? r + d : r;
        const nc = this.dir === "row" ? c + d : c;
        if (nr >= 0 && nc >= 0 && nr < s && nc < s) cells.push(idxOf(nr, nc, s));
      }
      setPts(st, me, ptsOf(st, me) - POWERS.strike.cost);
    }

    let sa = saOf(st, opp);
    const oppShips = shipsOf(st, opp);
    const shipCells = new Set(oppShips.flat());
    const results = []; const sunkLens = []; const wrecks = []; let gained = 0;
    for (const i of cells) {
      if (chAt(sa, i) !== ".") continue;
      const hit = shipCells.has(i);
      sa = chSet(sa, i, hit ? "h" : "m");
      results.push([i, hit ? "h" : "m"]);
      if (hit) {
        const ship = findShipAt(oppShips, i);
        if (ship && shipSunk(ship, sa)) {
          gained += ship.length; sunkLens.push(ship.length); wrecks.push(ship);
        }
      }
    }

    /* A sunk ship goes up with it: every square touching the wreck takes a hit.
       Ships are drawn as separate blobs, so anything orthogonally beside a wreck
       is guaranteed water — only a diagonally-touching ship can be caught, and if
       the blast finishes that one off, it detonates too. */
    const blast = [];
    const spent = new Set();
    const queue = [...wrecks];
    while (queue.length) {
      const wreck = queue.shift();
      if (spent.has(wreck[0])) continue;
      spent.add(wreck[0]);
      const hull = new Set(wreck);
      const ring = new Set();
      for (const ci of wreck) {
        const [wr, wc] = rcOf(ci, s);
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const nr = wr + dr, nc = wc + dc;
          if (nr < 0 || nc < 0 || nr >= s || nc >= s) continue;
          const ni = idxOf(nr, nc, s);
          if (!hull.has(ni)) ring.add(ni);
        }
      }
      for (const i of ring) {
        if (chAt(sa, i) !== ".") continue;
        const hit = shipCells.has(i);
        sa = chSet(sa, i, hit ? "h" : "m");
        blast.push([i, hit ? "h" : "m", "b"]);
        if (hit) {
          const ship = findShipAt(oppShips, i);
          if (ship && shipSunk(ship, sa)) {
            gained += ship.length; sunkLens.push(ship.length); queue.push(ship);
          }
        }
      }
    }
    results.push(...blast);

    setSA(st, opp, sa);
    setPts(st, me, ptsOf(st, me) + gained);

    /* Mines belong to the defender: shooting one costs the attacker their momentum. */
    const defMines = mnOf(st, opp);
    const tripped = defMines.filter(m => results.some(x => x[0] === m));
    if (tripped.length) setMn(st, opp, defMines.filter(m => !tripped.includes(m)));

    // A plain shot that connects earns another go. Airstrikes don't.
    const myBf = { ...bfOf(st, me) };
    let struck = mode === "fire" && results.length && results[0][1] === "h";
    let dblUsed = false, spotTxt = "";
    if (mode === "fire" && !struck && myBf.dbl) { struck = true; dblUsed = true; delete myBf.dbl; }
    if (mode === "fire" && !results.some(x => x[1] === "h") && myBf.spot) {
      delete myBf.spot;
      const [sr, sc] = rcOf(aim, s);
      const hull = new Set(shipsOf(st, opp).flat());
      let near = false;
      for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = sr + dr, nc = sc + dc;
        if (nr < 0 || nc < 0 || nr >= s || nc >= s) continue;
        if (hull.has(idxOf(nr, nc, s))) { near = true; break; }
      }
      spotTxt = near ? " \uD83D\uDE81 Spotter: something's right beside it!" : " \uD83D\uDE81 Spotter: all clear nearby.";
    }
    if (tripped.length) struck = false;
    setBf(st, me, myBf);

    let logTxt;
    if (mode === "fire") {
      logTxt = struck
        ? `💥 ${nameOf(st, me)} hit${sunkLens.length ? " and SUNK a ship!" : "!"}`
        : `🌊 ${nameOf(st, me)} splashed a miss`;
    } else if (mode === "depth") {
      logTxt = `\uD83C\uDF0A ${nameOf(st, me)} rolled depth charges${sunkLens.length ? " \u2014 ship down!" : ""}`;
    } else if (mode === "storm") {
      logTxt = `\uD83C\uDF00 ${nameOf(st, me)} called down a storm${sunkLens.length ? " \u2014 ship down!" : ""}`;
    } else if (mode === "torp") {
      const landed = results.some(x => x[1] === "h");
      logTxt = `🛥 ${nameOf(st, me)} loosed a torpedo — ${landed
        ? (sunkLens.length ? "direct hit, ship down!" : "it found steel!")
        : "it ran the lane and found nothing"}`;
    } else if (mode === "nuke") {
      logTxt = `☢️ ${nameOf(st, me)} dropped the big one${sunkLens.length ? " — devastating!" : ""}`;
    } else {
      logTxt = `✈️ ${nameOf(st, me)} called an airstrike${sunkLens.length ? " — ship down!" : ""}`;
    }
    if (gained) logTxt += ` (+${gained}★)`;
    if (blast.length) logTxt += ` The wreck blew ${blast.length} more square${blast.length > 1 ? "s" : ""} open.`;
    if (tripped.length) logTxt += ` \u2693 MINE! ${nameOf(st, opp)}'s trap ends the run.`;
    if (spotTxt) logTxt += spotTxt;
    if (dblUsed) logTxt += " \u26A1 Double tap \u2014 another shot!";
    else if (struck) logTxt += " Go again!";

    st.t = struck ? me : opp;
    st.la = { by: me, ty: mode, d: this.dir, c: results, k: sunkLens, center: aim };
    pushReel(st, me, st.la, struck);
    st.lg = [...st.lg.slice(-4), logTxt];

    if (allSunk(oppShips, sa)) {
      st.ph = "o"; st.w = me;
      st.lg = [...st.lg, `🏆 ${nameOf(st, me)} wins!`];
    }

    this.anim = { ty: mode, d: this.dir, c: results, gained };
    this.sel = null; this.mode = "fire"; this.netErr = "";
    // Draw it now. Waiting on the round-trip first is what made this feel laggy.
    this.render();
    setTimeout(() => { this.anim = null; this.render(); },
      blast.length ? 900 + results.length * 55 + 1400 : this.actMs(st.la));
    this.commit();
  },

  async rematch() {
    const st = this.st;
    const nxt = freshState(st.s, st.b, st.n1, st.n2);
    nxt.mv = st.mv; // commit() bumps it
    nxt.t = st.w === "p1" ? "p2" : "p1"; // loser eventually fires first (joiner-first rule below)
    nxt.lg = ["🔄 Rematch!"];
    this.st = nxt;
    this.paint = new Set(); this.placeMsg = "";
    this.view = "place";
    await this.commit();
  },

  homeBtn() {
    if (this.pollTimer) clearInterval(this.pollTimer);
    this.st = null; this.id = null; this.me = null;
    history.replaceState(null, "", location.pathname);
    this.view = "home"; this.render();
  },

  openSaved(id) {
    if (!myGames()[id]) return;
    history.replaceState(null, "", "#g=" + id);
    this.open(id);
  },
  dropSaved(id) {
    if (!confirm("Remove this game from your list? (The other player keeps theirs.)")) return;
    forgetMyGame(id); this.render();
  },

  toggleHelp() { this.help = !this.help; this.render(); },

  /* ---------- messaging ---------- */
  gameLink() {
    return location.origin + location.pathname + "#g=" + this.id;
  },
  buildMessage() {
    const st = this.st, opp = other(this.me);
    const link = this.gameLink();
    if (st.ph === "p")
      return `⚓ ${nameOf(st, this.me)} challenges you to SketchShip! Open this on your own phone to draw your fleet & take the first shot:\n${link}`;
    if (st.ph === "o")
      return `🏆 SketchShip: ${nameOf(st, st.w)} wins! Tap for the wreckage & a rematch:\n${link}`;
    const last = st.lg[st.lg.length - 1] || "";
    return `🚢 Your move, ${nameOf(st, opp) || "Admiral"}! ${last}\n${link}`;
  },
  sendMove() {
    const msg = this.buildMessage();
    const fallbackCopy = (txt) => {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    };
    const p = (navigator.clipboard && navigator.clipboard.writeText)
      ? navigator.clipboard.writeText(msg).catch(() => fallbackCopy(msg))
      : Promise.resolve(fallbackCopy(msg));
    p.finally(() => {
      this.copied = true; this.render();
      setTimeout(() => { this.copied = false; this.render(); }, 3000);
      try { location.href = "sms:?&body=" + encodeURIComponent(msg); } catch (e) {}
    });
  },

  /* ================================================================
     RENDERING
     ================================================================ */
  cellPx() {
    const s = this.st ? this.st.s : 10;
    return Math.max(24, Math.min(40, Math.floor((Math.min(window.innerWidth, 520) - 52) / s)));
  },

  markSvg(res, fresh, delay) {
    const style = delay ? `animation-delay:${delay}ms` : "";
    if (res === "h") return `<svg class="mark ${fresh?'pop':''}" style="${style}" viewBox="0 0 24 24">
      <path d="M4 4 L20 20" stroke="#c23b32" stroke-width="3.4" stroke-linecap="round" fill="none"
        ${fresh?`class="drawme" style="stroke-dasharray:24;stroke-dashoffset:24;${style}"`:''}/>
      <path d="M20 4 L4 20" stroke="#c23b32" stroke-width="3.4" stroke-linecap="round" fill="none"
        ${fresh?`class="drawme d2" style="stroke-dasharray:24;stroke-dashoffset:24;${style}"`:''}/></svg>`;
    if (res === "m") return `<svg class="mark ${fresh?'pop':''}" style="${style}" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.5" stroke="#3e6fb0" stroke-width="2.6" fill="none"/></svg>`;
    if (res === "p") return `<svg class="mark ${fresh?'pop':''}" style="${style}" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7" stroke="#7a6bb5" stroke-width="2" stroke-dasharray="3 3" fill="rgba(122,107,181,0.15)"/>
      <circle cx="12" cy="12" r="1.8" fill="#7a6bb5"/></svg>`;
    if (res === "c") return `<svg class="mark" style="opacity:0.4;${style}" viewBox="0 0 24 24">
      <path d="M7 13 L11 16 L17 8" stroke="#5b8a5e" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
    return "";
  },

  boardHtml(variant) {
    const st = this.st, me = this.me, opp = other(me);
    const s = st.s, px = this.cellPx(), boardPx = px * s;
    const anim = this.anim;
    const animOnThis =
      anim && ((anim.incoming && variant === "fleet") || (!anim.incoming && variant === "target"));
    const freshMap = {};
    if (animOnThis && anim.c) anim.c.forEach(([i, r, b], k) => { freshMap[i] = { r, k, b }; });

    let cells = "";
    for (let i = 0; i < s * s; i++) {
      let cls = "cell", mark = "";
      if (variant === "place") {
        if (this.paint.has(i)) cls += " painted";
        cells += `<div class="${cls}" onclick="App.tapPaint(${i})"></div>`;
        continue;
      }
      if (variant === "fleet") {
        const ch = chAt(saOf(st, me), i);
        const ownAim = st.ph === "b" && st.t === me && aimOf(this.mode) === "own" && !this.replaying;
        if (freshMap[i]) {
          const f = freshMap[i];
          const delay = f.b ? 650 + f.k * 55
          : anim.ty === "strike" ? 900 + f.k * 240
          : anim.ty === "torp" ? 280 + f.k * 100
          : anim.ty === "nuke" ? 780 + f.k * 60
          : anim.ty === "storm" ? 380 + f.k * 130
          : anim.ty === "depth" ? 380 + f.k * 320
          : anim.ty === "sonar" ? 600 + f.k * 60 : 100;
          mark = this.markSvg(f.r, true, delay);
        } else if (animOnThis && anim.mask && anim.mask.has(i)) mark = "";
        else if (ch === "h") mark = this.markSvg("h");
        else if (ch === "m") mark = this.markSvg("m");
        if (!mark && mnOf(st, me).includes(i)) mark = `<span class="mineMark">\u2693</span>`;
        if (ownAim) {
          if (this.sel === i) cls += " sel";
          cells += `<div class="${cls}" onclick="App.tapOwn(${i})">${mark}</div>`;
          continue;
        }
        cells += `<div class="${cls}">${mark}</div>`;
        continue;
      }
      const ch = chAt(saOf(st, opp), i);
      const intel = chAt(intelOf(st, me), i);
      if (freshMap[i]) {
        const f = freshMap[i];
        const delay = f.b ? 650 + f.k * 55
          : anim.ty === "strike" ? 900 + f.k * 240
          : anim.ty === "torp" ? 280 + f.k * 100
          : anim.ty === "nuke" ? 780 + f.k * 60
          : anim.ty === "storm" ? 380 + f.k * 130
          : anim.ty === "depth" ? 380 + f.k * 320
          : anim.ty === "sonar" ? 600 + f.k * 60 : 100;
        mark = this.markSvg(f.r, true, delay);
      } else if (ch === "h") mark = this.markSvg("h");
      else if (ch === "m") mark = this.markSvg("m");
      else if (intel === "y") mark = this.markSvg("p");
      else if (intel === "n") mark = this.markSvg("c");
      if (this.sel != null && st.t === me && st.ph === "b") {
        const [sr, sc] = rcOf(this.sel, s), [r, c] = rcOf(i, s);
        if ((this.mode === "sonar" || this.mode === "nuke") && Math.abs(r-sr) <= 1 && Math.abs(c-sc) <= 1) cls += " preview";
        if (this.mode === "torp" && ((this.dir === "row" && r === sr) || (this.dir === "col" && c === sc))) cls += " preview";
        if (this.mode === "depth" && Math.abs(r-sr) <= 2 && Math.abs(c-sc) <= 2) cls += " preview";
        if (this.mode === "strike" &&
            ((this.dir === "row" && r === sr && Math.abs(c-sc) <= 2) ||
             (this.dir === "col" && c === sc && Math.abs(r-sr) <= 2))) cls += " preview";
        if (this.sel === i) cls += " sel";
      }
      cells += `<div class="${cls}" onclick="App.tapTarget(${i})">${mark}</div>`;
    }

    let overlays = "";
    let shipsToDraw = [];
    if (variant === "fleet") shipsToDraw = shipsOf(st, me).map(sh => [sh, shipSunk(sh, saOf(st, me))]);
    if (variant === "target") shipsToDraw = shipsOf(st, opp).filter(sh => shipSunk(sh, saOf(st, opp))).map(sh => [sh, true]);
    for (const [ship, sunk] of shipsToDraw) {
      const rcs = ship.map(i => rcOf(i, s));
      const minR = Math.min(...rcs.map(x => x[0])), maxR = Math.max(...rcs.map(x => x[0]));
      const minC = Math.min(...rcs.map(x => x[1])), maxC = Math.max(...rcs.map(x => x[1]));
      overlays += `<div class="ship${sunk ? " sunk" : ""}" style="
        left:${minC*px+3}px; top:${minR*px+3}px;
        width:${(maxC-minC+1)*px-6}px; height:${(maxR-minR+1)*px-6}px;
        border-radius:${px/2}px;"></div>`;
    }

    let extras = "";
    if (animOnThis && anim.ty === "strike" && anim.c && anim.c.length) {
      const [r, c] = rcOf(anim.c[0][0], s);
      const horiz = (anim.d || "row") === "row";
      if (horiz)
        extras += `<div class="plane" style="top:${r*px+px/2-15}px; left:-34px; --fly:translate(${boardPx+70}px,0);">✈️</div>`;
      else
        extras += `<div class="plane" style="left:${c*px+px/2-15}px; top:-34px; --rot:rotate(90deg); --fly:translate(0,${boardPx+70}px);">✈️</div>`;
    }
    if (animOnThis && anim.ty === "torp" && anim.c && anim.c.length) {
      const [r, c] = rcOf(anim.c[0][0], s);
      const horiz = (anim.d || "row") === "row";
      const runPx = anim.c.length * px;
      if (horiz) {
        extras += `<div class="plane" style="top:${r*px+px/2-14}px; left:-30px; --fly:translate(${runPx+30}px,0);">🛥</div>`;
        extras += `<div class="wake" style="top:${r*px+px/2}px; left:0; width:${runPx}px;"></div>`;
      } else {
        extras += `<div class="plane" style="left:${c*px+px/2-14}px; top:-30px; --rot:rotate(90deg); --fly:translate(0,${runPx+30}px);">🛥</div>`;
        extras += `<div class="wake" style="left:${c*px+px/2}px; top:0; width:${runPx}px;
          transform-origin:left center; rotate:90deg;"></div>`;
      }
    }
    if (animOnThis && anim.ty === "nuke" && anim.center != null) {
      const [r, c] = rcOf(anim.center, s);
      extras += `<div class="plane" style="top:${Math.max(r*px+px/2-40,-30)}px; left:-34px; --fly:translate(${boardPx+70}px,0);">✈️</div>`;
      extras += `<div class="nuke" style="left:${c*px+px/2}px; top:${r*px+px/2}px;">💥</div>`;
    }
    if (animOnThis && anim.ty === "sonar" && anim.center != null) {
      const [r, c] = rcOf(anim.center, s);
      extras += `<div class="ping" style="left:${c*px+px/2}px; top:${r*px+px/2}px;"></div>
                 <div class="ping" style="left:${c*px+px/2}px; top:${r*px+px/2}px; animation-delay:0.5s;"></div>`;
    }
    if (animOnThis && anim.gained) {
      extras += `<div class="floater" style="left:${boardPx/2-20}px; top:${boardPx/2-10}px;">+${anim.gained}★</div>`;
    }

    return `<div class="boardWrap"><div class="board" style="
      width:${boardPx}px; height:${boardPx}px;
      grid-template-columns:repeat(${s}, ${px}px);
      background-image:linear-gradient(#c9ddec 1px, transparent 1px), linear-gradient(90deg, #c9ddec 1px, transparent 1px);
      background-size:${px}px ${px}px;">${cells}${overlays}${extras}</div></div>`;
  },

  headerHtml() {
    return `<div class="header">
      <div class="logo" onclick="App.homeBtn()">Sketch<b>Ship</b> ⚓</div>
      <div style="display:flex;gap:8px">
        <button class="iconBtn" onclick="App.toggleHelp()">?</button>
        <button class="iconBtn" onclick="App.homeBtn()">⌂</button>
      </div>
    </div>`;
  },

  helpHtml() {
    if (!this.help) return "";
    return `<div class="card"><h2>How to play</h2><div class="body">
      Draw your fleet with your ship points — one big battleship, a swarm of tiny boats, anything, as long as ships are straight lines.
      Take turns firing one shot. <b>Land a hit and you shoot again</b> — keep going until you miss.
      Sink a ship, pocket its length in ★.<br><br>
<b>Attacks</b> (these use your turn):<br>
      <b>⚓ Mine (${POWERS.mine.cost}★)</b> — hide a mine in your own water. Shoot it and their run ends on the spot.<br>
      <b>📡 Sonar (${POWERS.sonar.cost}★)</b> — scan a 3×3 area, no damage.<br>
      <b>🔧 Repair (${POWERS.repair.cost}★)</b> — patch one damaged square on a ship that hasn't sunk.<br>
      <b>🌊 Charges (${POWERS.depth.cost}★)</b> — three blind hits scattered in a 5×5 box.<br>
      <b>✈️ Strike (${POWERS.strike.cost}★)</b> — bomb 5 cells in a line.<br>
      <b>🛥 Torpedo (${POWERS.torp.cost}★)</b> — a sub runs a whole row or column and detonates on the first ship it meets.<br>
      <b>🌀 Storm (${POWERS.storm.cost}★)</b> — one random square in every row takes a hit.<br>
      <b>☢️ Nuke (${POWERS.nuke.cost}★)</b> — flattens a full 3×3 block. Save up.<br><br>
      <b>Support</b> (buy, then still take your shot):<br>
      <b>📻 Intercept (${POWERS.radio.cost}★)</b> — learn the size of their biggest ship still afloat.<br>
      <b>🚁 Spotter (${POWERS.spot.cost}★)</b> — your next miss tells you if a ship sits beside it.<br>
      <b>💨 Smoke (${POWERS.smoke.cost}★)</b> — their next sonar or intercept comes back a lie.<br>
      <b>⚡ Double (${POWERS.dbl.cost}★)</b> — your next shot earns another go even if it misses.<br><br>
      No timers. The board updates by itself — the 💬 button just texts them a "your move" nudge.
      One link per game: whoever opens it on their own phone gets their own side, and it stays theirs.
    </div></div>`;
  },

  netErrHtml() {
    return this.netErr ? `<div class="card" style="border-color:#c23b32"><div class="body">${this.netErr}</div></div>` : "";
  },

  nudgeHtml(sub) {
    return `<div class="card" style="text-align:center">
      <div class="body">${sub}</div>
      <div style="margin-top:10px">
        <span class="btn primary big" onclick="App.sendMove()">
          ${this.copied ? "✓ Copied — paste & send!" : "💬 Text them the game link"}
        </span>
      </div>
      <div class="hint">Opens Messages pre-filled. If it doesn't, the message is on your clipboard.</div>
    </div>`;
  },

  /* If a render ever throws, the screen would otherwise freeze mid-paint with
     dead buttons and no way back. Catch it, say so, and offer an escape. */
  render() {
    try { this.drawView(); }
    catch (err) {
      console.error("render failed:", err);
      const el = document.getElementById("app");
      if (el) el.innerHTML = `<div class="card">
        <h2>\u26A0\uFE0F Something jammed</h2>
        <div class="body">The board couldn't be drawn. Your game is safe on the server \u2014 reopening usually clears it.</div>
        <div class="row" style="margin-top:12px">
          <span class="btn primary" onclick="location.reload()">Reload</span>
          <span class="btn" onclick="location.hash='';location.reload()">Back to home</span>
        </div>
        <div class="hint" style="margin-top:10px">${String(err && err.message || err)}</div>
      </div>`;
    }
  },

  drawView() {
    const el = document.getElementById("app");
    const st = this.st;

    if (this.view === "loading") {
      el.innerHTML = this.headerHtml() + `<div class="card" style="text-align:center"><h2><span class="spin">⚓</span> Unrolling the map…</h2></div>`;
      return;
    }

    if (this.view === "home") {
      const games = Object.entries(myGames()).sort((a, b) => b[1].ts - a[1].ts);
      const list = games.length ? `<div class="card"><h2>Your battles</h2>` +
        games.map(([id, g]) => `<div class="gameRow">
          <span class="body">${g.label || id}</span>
          <span>
            <span class="btn small primary" onclick="App.openSaved('${id}')">Open ▶︎</span>
            <span class="btn small" onclick="App.dropSaved('${id}')">✕</span>
          </span></div>`).join("") + `</div>` : "";
      el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
        ${list}
        <div class="card"><h2>Ahoy! ⚓</h2>
          <div class="body">A slow-burn battleship for two people who text each other. No timers, no passwords — got an invite? Just tap the link you were texted, on your own phone.</div>
          <div style="margin-top:14px">
            <span class="btn primary big" onclick="App.startSetup()">Start a new game</span>
          </div>
        </div>`;
      return;
    }

    if (this.view === "setup") {
      const savedName = (lsGet("sks:name") || "").replace(/"/g, "&quot;");
      el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
        <div class="card"><h2>Start a new voyage</h2>
          <div class="label">Your name</div>
          <input type="text" id="nm" value="${savedName}" placeholder="Admiral…">
          <div class="label">Ocean size</div>
          <div class="row" style="justify-content:flex-start">
            <span class="btn small sizeBtn" data-s="8" onclick="App.pickSize(this)">8×8</span>
            <span class="btn small sizeBtn primary" data-s="10" onclick="App.pickSize(this)">10×10</span>
            <span class="btn small sizeBtn" data-s="12" onclick="App.pickSize(this)">12×12</span>
          </div>
          <div class="label">Ship points each</div>
          <div class="row" style="justify-content:flex-start;align-items:center">
            <span class="btn small" onclick="App.bumpBudget(-2)">−</span>
            <h2 id="budget" style="min-width:40px;text-align:center;margin:0">14</h2>
            <span class="btn small" onclick="App.bumpBudget(2)">+</span>
          </div>
          <div style="margin-top:16px"><span class="btn primary big" onclick="App.createGame()">Set sail ⛵</span></div>
        </div>`;
      return;
    }

    if (this.view === "place") {
      const myShips = shipsOf(st, this.me);
      if (myShips.length > 0) {
        const oppName = nameOf(st, other(this.me));
        el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
          <div class="card" style="text-align:center"><h2>Fleet anchored! ⚓</h2>
            <div class="body">Waiting for ${oppName || "your opponent"} to place their ships — this page updates by itself.</div>
          </div>` +
          this.nudgeHtml(oppName ? `Give ${oppName} a nudge:` : `Invite your opponent — their link is inside:`);
        return;
      }
      const needName = !nameOf(st, this.me);
      const nmEl = document.getElementById("nm");
      const typedName = (nmEl ? nmEl.value : (lsGet("sks:name") || "")).replace(/"/g, "&quot;");
      const analysis = this.paint.size ? analyzeShips(this.paint, st.s) : { ok: true, ships: [] };
      const fleet = analysis.ok ? analysis.ships.map(x => x.length).sort((a,b)=>b-a).join(" + ") : "";
      el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
        <div class="card">
          <h2>${needName ? `Join ${st.n1}'s battle!` : `Draw your fleet, ${nameOf(st, this.me)}`}</h2>
          ${needName ? `<div class="label">Your name</div><input type="text" id="nm" value="${typedName}" placeholder="Your name…">` : ""}
          <div class="body" style="margin-top:8px">Tap squares to sketch ships — straight lines only, any lengths.</div>
          <div class="body" style="margin-top:4px"><b>${st.b - this.paint.size}</b> of ${st.b} points left${fleet ? ` · fleet: ${fleet}` : ""}</div>
        </div>
        ${this.boardHtml("place")}
        ${this.placeMsg ? `<div class="warn">${this.placeMsg}</div>` : ""}
        ${!analysis.ok ? `<div class="warn">${analysis.error}</div>` : ""}
        <div class="row" style="margin-top:12px">
          <span class="btn" onclick="App.clearPaint()">Clear</span>
          <span class="btn primary" onclick="App.confirmPlacement()">Ready for battle!</span>
        </div>`;
      return;
    }

    /* ----- battle / over ----- */
    const me = this.me, opp = other(me);
    const myTurn = st.ph === "b" && st.t === me;
    const overMsg = st.ph === "o"
      ? (st.w === me ? `<span style="color:#5b8a5e">🏆 Victory!</span>` : `<span style="color:#c23b32">💀 Sunk…</span>`)
      : myTurn ? `<span style="color:#c23b32">Your move!</span>` : `<span style="opacity:0.6">Their move…</span>`;

    let controls = "";
    if (myTurn) {
      const pts = ptsOf(st, me);
      const canPower = pts >= CHEAPEST;
      const bf = bfOf(st, me);
      const chip = m => {
        const P = POWERS[m];
        return `<span class="btn small ${this.mode===m?"primary":""} ${pts<P.cost?"dim":""}" onclick="App.${P.kind==="sup"?`useSupport('${m}')`:`setMode('${m}')`}">${P.icon} ${P.label} ${P.cost}★</span>`;
      };
      const acts = Object.keys(POWERS).filter(m => POWERS[m].kind === "act");
      const sups = Object.keys(POWERS).filter(m => POWERS[m].kind === "sup");
      const armed = [bf.spot ? "🚁 spotter up" : "", bf.smoke ? "💨 smoke laid" : "", bf.dbl ? "⚡ second round" : ""]
        .filter(Boolean).join(" · ");
      const aim = aimOf(this.mode);
      const ready = aim === "none" || this.sel != null;
      const label = (this.mode==="fire" ? "Fire! 💥"
        : this.mode==="sonar" ? "Ping! 📡"
        : this.mode==="torp" ? "Launch! 🛥"
        : this.mode==="nuke" ? "Drop it! ☢️"
        : this.mode==="depth" ? "Roll them! 🌊"
        : this.mode==="storm" ? "Summon it! 🌀"
        : this.mode==="repair" ? "Patch it! 🔧"
        : this.mode==="mine" ? "Lay it! ⚓" : "Bombs away! ✈️")
        // the shot is already on screen; a quiet dot beats blanking the button
        + (this.saving ? `<span class="syncDot"></span>` : "");
      const hint = aim === "none" ? "No aiming needed — hit the button"
        : aim === "own" ? (this.mode==="repair"
            ? "Tap a damaged square of your own fleet to patch"
            : "Tap open water in your own grid to hide the mine")
        : this.mode==="torp" ? (this.sel==null ? "Tap any square to pick the lane — the torpedo runs it from the edge"
                                               : "Lane set — it stops at the first ship it meets")
        : this.sel==null ? "Tap a square on their waters to aim"
        : "Locked on — tap the button above to shoot";
      controls = `
        <div class="row" style="margin-top:10px">
          <span class="btn primary big" style="max-width:280px;${!ready?"opacity:0.4;pointer-events:none":this.saving?"pointer-events:none":""}" onclick="App.doAction()">${label}</span>
        </div>
        <div class="hint">${hint}</div>
        ${this.mode === "strike" || this.mode === "torp" ? `<div class="row" style="margin-top:8px">
          <span class="btn small ${this.dir==="row"?"primary":""}" onclick="App.setDir('row')">↔︎ Across</span>
          <span class="btn small ${this.dir==="col"?"primary":""}" onclick="App.setDir('col')">↕︎ Down</span>
        </div>` : ""}
        ${canPower ? `<div class="row" style="margin-top:12px">
          <span class="btn small ${this.mode==="fire"?"primary":""}" onclick="App.setMode('fire')">🎯 Shot</span>
          ${acts.map(chip).join("")}
        </div>
        <div class="row" style="margin-top:6px">${sups.map(chip).join("")}</div>` : ""}
        ${armed ? `<div class="hint" style="margin-top:6px">Armed: ${armed}</div>` : ""}`;
    } else if (st.ph === "b") {
      controls = `<div style="margin-top:10px"></div>` +
        this.nudgeHtml(`Waiting for ${nameOf(st, opp) || "them"} — the board updates by itself. Impatient?`);
    }

    let overCard = "";
    if (st.ph === "o") {
      overCard = `<div class="card" style="text-align:center;margin-top:10px">
        <h2>${nameOf(st, st.w)} rules the seas!</h2>
        <div class="row" style="margin-top:8px">
          <span class="btn primary" onclick="App.rematch()">Rematch 🔄</span>
        </div>
      </div>` + (st.la && st.la.by === me ? this.nudgeHtml(`Tell ${nameOf(st, opp)} how it ended:`) : "");
    }

    const logs = st.lg.slice(-4).reverse()
      .map((l, k) => `<div class="body ${k===0?"log0":"logn"}">${l}</div>`).join("");

    el.innerHTML = this.headerHtml() + this.helpHtml() + this.netErrHtml() + `
      <div class="status">
        <div><div class="pname">${nameOf(st, me) || "You"}</div><div class="star">★ ${ptsOf(st, me)}</div></div>
        <div style="text-align:center;flex:1"><div class="turnTxt">${overMsg}</div></div>
        <div style="text-align:right"><div class="pname">${nameOf(st, opp) || "Them"}</div><div class="star">★ ${ptsOf(st, opp)}</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${this.tab==="target"?"active":""}" onclick="App.setTab('target')">🎯 Their waters</div>
        <div class="tab ${this.tab==="fleet"?"active":""}" onclick="App.setTab('fleet')">🚢 Your fleet</div>
      </div>
      ${this.reelBtnHtml()}
      ${this.boardHtml(this.tab === "target" ? "target" : "fleet")}
      ${controls}
      ${overCard}
      <div class="card" style="margin-top:12px">
        <div class="label" style="margin-top:0">Captain's log</div>${logs}
      </div>`;
  },
};

window.App = App;
App.boot();
window.addEventListener("hashchange", () => App.boot());
document.addEventListener("visibilitychange", () => { if (!document.hidden) App.pollNow(); });
window.addEventListener("focus", () => App.pollNow());
window.addEventListener("pageshow", () => App.pollNow());
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
  if (window.innerWidth !== lastW) { lastW = window.innerWidth; App.render(); }
});
</script>
</body>
</html>
